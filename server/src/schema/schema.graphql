# Slice 4 — Mutations + Input types
# Queries read. Mutations change. Never reuse object types as mutation args — use input.

type User {
  id: ID!
  name: String!
  email: String!
  """Posts written by this user — resolved via authorId FK."""
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  body: String!
  published: Boolean!
  tags: [String!]!
  createdAt: String!
  """Nested resolver: parent.authorId → db.findUserById"""
  author: User!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  text: String!
  author: User!
  post: Post!
}

"""
INPUT types: write-side payloads.
Defaults apply when the client omits the field.
authorId is temporary until Slice 6 (context / auth).
"""
input CreatePostInput {
  title: String!
  body: String!
  authorId: ID!
  tags: [String!] = []
  published: Boolean = false
}

input UpdatePostInput {
  title: String
  body: String
  tags: [String!]
  published: Boolean
}

type Query {
  hello: String!

  users: [User!]!
  user(id: ID!): User

  """Optional filter: posts(published: true)"""
  posts(published: Boolean): [Post!]!
  post(id: ID!): Post
}

type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): Boolean!
  addComment(postId: ID!, text: String!, authorId: ID!): Comment!
}
