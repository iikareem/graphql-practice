# Slice 6 — Context + simple auth
# Header x-user-id → context.user. Mutations take author from context (no authorId args).

"""Fixed set of roles — client can only send / receive these values."""
enum Role {
  USER
  ADMIN
}

"""
Shared contract: any type that implements Node must have id.
Query.node returns Node — client uses inline fragments (... on User).
"""
interface Node {
  id: ID!
}

type User implements Node {
  id: ID!
  name: String!
  email: String!
  role: Role!
  """Posts written by this user — resolved via authorId FK."""
  posts: [Post!]!
}

type Post implements Node {
  id: ID!
  title: String!
  body: String!
  published: Boolean!
  tags: [String!]!
  createdAt: String!
  """Nested resolver: parent.authorId → db.findUserById"""
  author: User!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  text: String!
  author: User!
  post: Post!
}

"""Another Node implementor — used with Post in SearchResult union."""
type Product implements Node {
  id: ID!
  name: String!
  description: String!
  price: Float!
  tags: [String!]!
}

"""
Union = one-of (no shared fields required).
Client must use inline fragments: ... on Post { title } ... on Product { price }
"""
union SearchResult = Post | Product

"""
INPUT types: write-side payloads.
authorId removed in Slice 6 — author comes from context.user (x-user-id header).
"""
input CreatePostInput {
  title: String!
  body: String!
  tags: [String!] = []
  published: Boolean = false
}

input UpdatePostInput {
  title: String
  body: String
  tags: [String!]
  published: Boolean
}

type Query {
  hello: String!

  """Current user from x-user-id header, or null if missing/unknown."""
  me: User

  users: [User!]!
  user(id: ID!): User

  """Optional filter: posts(published: true)"""
  posts(published: Boolean): [Post!]!
  post(id: ID!): Post

  products: [Product!]!
  product(id: ID!): Product

  """
  Polymorphic lookup. Pass a global id: "User:1", "Post:2", or "Product:1"
  (local table ids collide — Node needs a type prefix).
  """
  node(id: ID!): Node

  """Search posts + products by term; returns a mix — use inline fragments."""
  search(term: String!): [SearchResult!]!
}

type Mutation {
  """Requires auth. Author = context.user."""
  createPost(input: CreatePostInput!): Post!
  """Requires auth. Owner of the post, or ADMIN."""
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  """Requires ADMIN role."""
  deletePost(id: ID!): Boolean!
  """Requires auth. Comment author = context.user."""
  addComment(postId: ID!, text: String!): Comment!
}
